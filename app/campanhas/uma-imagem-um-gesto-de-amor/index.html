<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00676D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Uma Imagem, Um Gesto de Amor — Paróquia Mãe da Divina Providência</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #00676D;
      --primary-dark: #004F54;
      --primary-light: #E6F3F4;
      --accent-red: #D32F2F;
      --bg: #F4F6F8;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      --radius: 18px;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-top: calc(60px + env(safe-area-inset-top));
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
      user-select: none;
    }

    /* Top App Bar */
    .app-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(60px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: var(--primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 79, 84, 0.25);
    }

    .app-bar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-bar-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .app-bar-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .app-bar-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .app-bar-subtitle {
      font-size: 0.68rem;
      opacity: 0.88;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .app-bar-badge {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    /* Campaign Header Card */
    .campaign-header {
      max-width: 520px;
      margin: 16px auto 12px;
      padding: 0 16px;
    }

    .campaign-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      text-align: center;
    }

    .campaign-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .campaign-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .campaign-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 500;
    }

    /* Feed Container */
    .feed-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 8px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Feed Post Card */
    .post-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      transition: transform 0.15s ease;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
    }

    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      flex-shrink: 0;
      border: 1.5px solid rgba(0, 103, 109, 0.2);
    }

    .post-user-info {
      flex: 1;
      min-width: 0;
    }

    .post-username {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .post-username .verified {
      color: var(--primary);
      font-size: 0.85rem;
    }

    .post-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .post-image-wrap {
      width: 100%;
      background: #000000;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .post-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-action {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .btn-action svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      transition: all 0.2s ease;
    }

    .btn-action.liked {
      color: var(--accent-red);
    }

    .btn-action.liked svg {
      fill: var(--accent-red);
      stroke: var(--accent-red);
      transform: scale(1.15);
    }

    .post-caption {
      padding: 0 16px 16px;
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.55;
    }

    .post-caption strong {
      color: var(--primary-dark);
      font-weight: 700;
      margin-right: 4px;
    }

    /* Skeleton Loading */
    .skeleton-card {
      background: #FFFFFF;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .skeleton-header {
      height: 56px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e6e6e6 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(90deg, #f0f0f0 25%, #e6e6e6 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Fixed Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      z-index: 100;
      display: flex;
      justify-content: center;
    }

    .bottom-bar-content {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 12px;
    }

    .btn-cta {
      flex: 1;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 9999px;
      box-shadow: 0 4px 12px rgba(0, 103, 109, 0.3);
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-cta:active {
      transform: scale(0.97);
      background: var(--primary-dark);
    }

    /* Fullscreen Photo Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .lightbox-close {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #FFFFFF;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-bar">
    <div class="app-bar-brand">
      <img src="logo_paroquia.png" alt="Logo Paróquia" class="app-bar-logo" />
      <div class="app-bar-title-wrap">
        <span class="app-bar-title">Mãe da Divina Providência</span>
        <span class="app-bar-subtitle">Paróquia Católica</span>
      </div>
    </div>
    <div class="app-bar-badge" id="counter-badge">Mural</div>
  </header>

  <!-- Real Campaign Info -->
  <div class="campaign-header">
    <div class="campaign-card">
      <span class="campaign-tag">Campanha Paroquial</span>
      <h1 class="campaign-title">Uma Imagem, Um Gesto de Amor</h1>
      <p class="campaign-desc">
        Fotos e recados de quem já recebeu a imagem da Mãe da Divina Providência e ajudou na ampliação da nossa paróquia.
      </p>
    </div>
  </div>

  <!-- Social Media Feed of Real Participants -->
  <main class="feed-container" id="feed-container">
    <div class="skeleton-card">
      <div class="skeleton-header"></div>
      <div class="skeleton-img"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-header"></div>
      <div class="skeleton-img"></div>
    </div>
  </main>

  <!-- Fixed Mobile Bottom CTA Bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <a href="https://paroquia.vandemirsistemas.com.br/index.php?r=ar_campanha" class="btn-cta" target="_blank" rel="noopener">
        <span>Conheça a Campanha</span>
        <span>→</span>
      </a>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" aria-label="Fechar">✕</button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="Foto em tela cheia" />
  </div>

  <script>
    const WORKER_URL = 'https://mural-proxy.rodolfo-oshiro.workers.dev/mural';
    const LIKES_KEY = 'mural_liked_items_v1';
    let likedItems = {};

    try {
      likedItems = JSON.parse(localStorage.getItem(LIKES_KEY) || '{}');
    } catch (_) {}

    async function loadFeed() {
      const container = document.getElementById('feed-container');
      const badge = document.getElementById('counter-badge');

      try {
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error('Falha ao carregar mural');
        const data = await res.json();
        const items = data.items || [];

        if (items.length === 0) {
          container.innerHTML = `
            <div style="background: #fff; padding: 32px 20px; border-radius: 18px; text-align: center; color: #6B7280;">
              Nenhuma foto publicada no momento.
            </div>
          `;
          return;
        }

        badge.textContent = `${items.length} fiéis`;

        container.innerHTML = items.map((item, idx) => {
          const isLiked = !!likedItems[idx];
          return `
            <article class="post-card">
              <header class="post-header">
                <div class="post-avatar">⛪</div>
                <div class="post-user-info">
                  <div class="post-username">
                    <span>Paroquiano(a)</span>
                    <span class="verified" title="Imagem recebida">✓</span>
                  </div>
                  <div class="post-meta">Mural da Imagem • Registro #${idx + 1}</div>
                </div>
              </header>

              <div class="post-image-wrap" onclick="openLightbox('${item.img}')">
                <img src="${item.img}" alt="Devoto com a imagem" class="post-image" loading="lazy" />
              </div>

              <div class="post-actions">
                <div class="action-left">
                  <button class="btn-action ${isLiked ? 'liked' : ''}" id="like-btn-${idx}" onclick="toggleLike(${idx})">
                    <svg viewBox="0 0 24 24" stroke-width="2">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <span id="like-txt-${idx}">${isLiked ? 'Abençoado' : 'Abençoar'}</span>
                  </button>

                  <button class="btn-action" onclick="sharePost('${item.img}', '${escapeAttr(item.text)}')">
                    <svg viewBox="0 0 24 24" stroke-width="2">
                      <circle cx="18" cy="5" r="3" />
                      <circle cx="6" cy="12" r="3" />
                      <circle cx="18" cy="19" r="3" />
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                    </svg>
                    <span>Compartilhar</span>
                  </button>
                </div>
              </div>

              <div class="post-caption">
                <strong>Depoimento:</strong>
                <span>${escapeHtml(item.text)}</span>
              </div>
            </article>
          `;
        }).join('');

      } catch (err) {
        console.error('Erro ao carregar feed:', err);
        container.innerHTML = `
          <div style="background: #fff; padding: 32px 20px; border-radius: 18px; text-align: center; color: #6B7280;">
            <p style="margin-bottom: 12px;">Não foi possível carregar os depoimentos no momento.</p>
            <a href="https://paroquia.vandemirsistemas.com.br/index.php?r=ar_campanha" style="color: var(--primary); font-weight: 700; text-decoration: underline;">
              Acessar a página oficial da campanha →
            </a>
          </div>
        `;
      }
    }

    function toggleLike(idx) {
      likedItems[idx] = !likedItems[idx];
      try {
        localStorage.setItem(LIKES_KEY, JSON.stringify(likedItems));
      } catch (_) {}

      const btn = document.getElementById(`like-btn-${idx}`);
      const txt = document.getElementById(`like-txt-${idx}`);
      if (btn && txt) {
        if (likedItems[idx]) {
          btn.classList.add('liked');
          txt.textContent = 'Abençoado';
        } else {
          btn.classList.remove('liked');
          txt.textContent = 'Abençoar';
        }
      }
    }

    async function sharePost(imgUrl, text) {
      const shareData = {
        title: 'Campanha Uma Imagem, Um Gesto de Amor',
        text: text ? `"${text}" — Paróquia Mãe da Divina Providência` : 'Campanha Uma Imagem, Um Gesto de Amor',
        url: window.location.href,
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (_) {}
      } else {
        try {
          await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
          alert('Link copiado para compartilhar!');
        } catch (_) {}
      }
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('active');
      document.body.style.overflow = '';
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function escapeAttr(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    loadFeed();
  </script>
</body>
</html>
